<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONO · 启动 / 界面设计</title>
<style>body{margin:0;background:#202427;color:#b9c2c7;font:14px/1.8 system-ui;min-height:100vh;display:grid;place-items:center}main{padding:30px;display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}canvas{width:480px;height:480px;image-rendering:pixelated;border:12px solid #171c1f;border-radius:18px}h1{font-size:24px;font-weight:400}.note{max-width:290px;color:#8c979f}select,a{color:#b9c2c7;background:#2d3438;border:1px solid #414c53;border-radius:6px;padding:10px}small{display:block;color:#8c979f;margin-top:18px}@media(max-width:600px){canvas{width:320px;height:320px}}</style>
<main><canvas id="screen" width="240" height="240"></canvas><section><small>MONO / SEGMENTED</small><h1>开机与界面设计</h1><select id="mode"><option value="boot">启动页</option><option value="setup">配网页</option><option value="progress">灰阶进度页</option></select><p class="note">这是浏览器设计示意，不是设备截图。字形与 TFT 内置字库会略有不同；不会连接设备或写入固件。</p><a href="/">查看同风格管理页</a><small>240 × 240 · 无外部图片/字体</small></section></main>
<script>
const c=document.getElementById('screen').getContext('2d'),started=performance.now(),palette={bg:'#2d3438',ink:'#b9c2c7',muted:'#8c979f',lit:'#a5b1b8',unlit:'#414c53'};
function text(s,x,y,size=8,color=palette.muted,align='left'){c.fillStyle=color;c.font=size+'px Consolas,monospace';c.textAlign=align;c.fillText(s,x,y)}
function bars(y,p){for(let n=0;n<20;n++){c.fillStyle=n<Math.floor(p/5)?palette.lit:palette.unlit;c.fillRect(16+Math.floor(n*208/20),y,8,9)}}
function digitalClock(value){
  const map={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
  const segments={a:[[4,0],[26,0],[30,4],[26,8],[4,8],[0,4]],g:[[4,22],[26,22],[30,26],[26,30],[4,30],[0,26]],d:[[4,44],[26,44],[30,48],[26,52],[4,52],[0,48]],f:[[0,5],[4,9],[8,12],[8,19],[4,23],[0,26]],b:[[30,5],[26,9],[22,12],[22,19],[26,23],[30,26]],e:[[0,27],[4,31],[8,34],[8,41],[4,45],[0,48]],c:[[30,27],[26,31],[22,34],[22,41],[26,45],[30,48]]};
  c.save();c.translate(42,41);
  let x=0;for(const char of value){if(char===':'){c.fillStyle=palette.ink;c.fillRect(x+3,15,5,5);c.fillRect(x+3,35,5,5);x+=18;continue}for(const [name,points] of Object.entries(segments)){c.fillStyle=map[char].includes(name)?palette.ink:'#333b40';c.beginPath();points.forEach(([px,py],i)=>i?c.lineTo(x+px,py):c.moveTo(x+px,py));c.closePath();c.fill()}x+=38}c.restore();
}
function draw(){
  c.fillStyle=palette.bg;c.fillRect(0,0,240,240);
  const mode=document.getElementById('mode').value,step=Math.floor((performance.now()-started)/1200);
  if(mode==='progress'){
    text('10月15日',16,29,14);text('星期四',224,31,16,palette.muted,'right');
    digitalClock('01:12');
    const names=['OpenAI 5 Hours','OpenAI Week','Cursor Month'];
    for(let i=0;i<3;i++){const p=(step+i*33)%101;text(names[i],16,108+i*42);text(p+'%',224,108+i*42,8,palette.ink,'right');bars(118+i*42,p)}
    text('DEMO / 192.168.1.42',16,226);
    text('ONLINE',214,226,8,palette.muted,'right');c.fillStyle='#39bc67';c.beginPath();c.arc(222,222,3,0,Math.PI*2);c.fill();
  }else{
    text('MONO / SEGMENTED',16,26);text(mode==='setup'?'SETUP / WI-FI':'CLOCK / PROGRESS',16,69,15,palette.ink);text('SDD MONO 0.2.0-dev',16,94);
    text(mode==='setup'?'Clock-XXXX':'Starting runtime',16,128);text(mode==='setup'?'http://192.168.4.1':'Network + local management',16,149);
    text('KEY [shown on device]',16,176);bars(203,mode==='setup'?30:Math.min(100,Math.floor((performance.now()-started)/200)));
  }
}
draw();setInterval(draw,100);
</script></html>
